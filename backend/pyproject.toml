[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-survivor-api"
version = "0.1.0"
description = "Fantasy Survivor API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "mangum>=0.17,<1",
]

[project.optional-dependencies]
dev = [
  "uvicorn[standard]>=0.30,<1",
  "httpx2>=2,<3",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "UP",       # pyupgrade
  "B",        # bugbear
  "SIM",      # simplify
  "N",        # pep8-naming
  "RUF",      # ruff-specific
  "S",        # bandit (security)
  "T20",      # no stray print()
  "ANN",      # type annotations
]
ignore = [
  "ANN401",   # Any is sometimes the honest type at the boundary
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "ANN"]   # asserts, hard-coded test secrets, annotations

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["mangum.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
